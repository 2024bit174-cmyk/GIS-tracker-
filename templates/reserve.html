<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrasah Reserve Commodity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { padding: 60px 0; }</style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="card shadow-lg">
            <div class="card-body">
                <h3>&#127942; Reserve This Commodity</h3>
                <p class="text-muted">Commodity: {{ commodity.name }}</p>
                <p class="text-muted">Category: <span class="{{ 'golden-card' if commodity.category == 'golden' else 'premium-card' }} mb-1">{{ commodity.category.upper() }}</span></p>
                <p class="text-muted">Price: UGX {{ commodity.price:,.2f }}</p>
                
                <form method="post">
                    <input type="hidden" name="commodity_id" value="{{ commodity.id }}">
                    
                    <div class="mb-3">
                        <label>Client Name <span class="text-danger">*</span></label>
                        <input type="text" name="client_name" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label>Phone Number <span class="text-danger">*</span></label>
                        <input type="tel" name="client_phone" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label>PIN <span class="text-danger">*</span></label>
                        <input type="number" name="pin" class="form-control" min="0" max="9999" required>
                        <small class="text-muted">Enter the PIN: <strong>{{ pin_code }}</strong></small>
                    </div>
                    
                    <input type="hidden" name="action" value="create_reservation">
                    
                    <button type="submit" class="btn btn-primary w-100">Confirm Reservation</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
