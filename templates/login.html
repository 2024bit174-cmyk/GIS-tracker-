<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrasah Portal Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; padding: 100px 0; }
        .login-card { max-width: 400px; margin: 0 auto; border: 1px solid #e3e6f0; border-radius: 8px; padding: 40px 30px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center text-primary mb-3">&#127942; Madrasah Portal</h2>
        <h3 class="text-center text-muted mb-4">Admin Login</h3>
        <form method="post" class="p-3 border-bottom">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
        <p class="text-center text-muted small mt-3">Demo Credentials: admin / admin123</p>
    </div>
</body>
</html>
